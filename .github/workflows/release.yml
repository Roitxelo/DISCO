name: Construir instaladores

on:
  push:
    branches: [analysis-v3]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disco-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Instalador Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Construir instalador
        run: npm run dist:win

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: DISCO-Windows-x64
          path: |
            dist/DISCO-*-win-x64.exe
            dist/DISCO-*-win-x64.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Instalador macOS Intel x64
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Construir DMG
        run: npm run dist:mac

      - name: Guardar DMG
        uses: actions/upload-artifact@v4
        with:
          name: DISCO-macOS-Intel-x64
          path: |
            dist/DISCO-*-mac-x64.dmg
            dist/DISCO-*-mac-x64.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar instaladores
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* || "${GITHUB_REF_NAME}" == *"-alpha"* || "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            extra_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            release-assets/DISCO-Windows-x64/* \
            release-assets/DISCO-macOS-Intel-x64/* \
            --title "DISCO ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${extra_flags[@]}"
