name: Construir instaladores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disco-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Instalador Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Auditar dependencias
        run: npm audit

      - name: Construir instalador
        run: npm run dist:win

      - name: Guardar instalador
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DISCO-Windows-x64
          path: |
            dist/DISCO-*-win-x64.exe
            dist/DISCO-*-win-x64.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Instalador macOS Intel x64
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Auditar dependencias
        run: npm audit

      - name: Construir DMG
        run: npm run dist:mac

      - name: Guardar DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DISCO-macOS-Intel-x64
          path: |
            dist/DISCO-*-mac-x64.dmg
            dist/DISCO-*-mac-x64.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14


  sbom:
    name: Inventario de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Generar SBOM CycloneDX
        run: npm sbom --sbom-format=cyclonedx > SBOM.cdx.json

      - name: Guardar SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DISCO-SBOM
          path: SBOM.cdx.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, sbom]
    runs-on: ubuntu-latest

    steps:
      - name: Descargar instaladores
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Generar checksums
        shell: bash
        run: |
          sha256sum \
            release-assets/DISCO-Windows-x64/*.exe \
            release-assets/DISCO-macOS-Intel-x64/*.dmg \
            | sed 's#release-assets/DISCO-Windows-x64/##; s#release-assets/DISCO-macOS-Intel-x64/##' \
            > SHA256SUMS.txt

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* || "${GITHUB_REF_NAME}" == *"-alpha"* || "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            extra_flags+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            release-assets/DISCO-Windows-x64/*.exe \
            release-assets/DISCO-macOS-Intel-x64/*.dmg \
            release-assets/DISCO-SBOM/SBOM.cdx.json \
            SHA256SUMS.txt \
            --title "DISCO ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${extra_flags[@]}"
