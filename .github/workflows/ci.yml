name: Validar DISCO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disco-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Comprobar que FFmpeg no se empaqueta como dependencia npm
        shell: bash
        run: |
          if [ -d node_modules/ffmpeg-static ]; then
            echo "ffmpeg-static sigue instalado y debe salir del árbol npm."
            exit 1
          fi

      - name: Comprobar vulnerabilidades altas
        run: npm audit

  secretos:
    name: Buscar secretos en el historial
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar historial completo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks verificado
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_ARCHIVE: gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$GITLEAKS_ARCHIVE"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Escanear todo el historial Git
        shell: bash
        run: |
          set -euo pipefail
          gitleaks-bin git --redact --no-banner --exit-code 1 --log-opts="--all" .

  build:
    name: Build en ${{ matrix.name }}
    needs: [seguridad, secretos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS Intel x64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Comprobar tipos y generar la aplicación
        run: npm run check
