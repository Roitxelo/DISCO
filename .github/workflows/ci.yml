name: Validar DISCO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disco-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Comprobar vulnerabilidades altas
        run: npm audit --audit-level=high

  build:
    name: Build en ${{ matrix.name }}
    needs: seguridad
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS Intel x64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $attempt/3). Reintentando..."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Comprobar tipos y generar la aplicación
        run: npm run check
