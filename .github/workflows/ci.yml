name: Validar DISCO

on:
  push:
    branches: [main, analysis-v3]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: disco-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Comprobar tipos y generar la aplicación
        run: npm run build
